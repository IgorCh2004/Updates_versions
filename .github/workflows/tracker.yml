name: RuStore tracker

on:
  schedule:
    - cron: "59 20 * * *"   # каждый день в 20:59 UTC = 23:59 МСК (GitHub может запустить с опозданием)
  # решение с вкладки проверки записывается в decisions.json — сразу применяем его
  push:
    branches: [main]
    paths: [decisions.json]
  workflow_dispatch:
    inputs:
      mode:
        description: "Режим запуска"
        type: choice
        default: check
        options:
          - check
          - test-email
          - debug
          - backfill

permissions:
  contents: write

concurrency:
  group: rustore-tracker
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tracker
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          HISTORY_URL: ${{ vars.HISTORY_URL }}
          MODE: ${{ inputs.mode }}
          EVENT: ${{ github.event_name }}
        run: |
          case "$MODE" in
            test-email) python tracker.py --test-email ;;
            debug)      python tracker.py --dry-run --debug ;;
            backfill)   python tracker.py --backfill ;;
            *)          if [ "$EVENT" = "push" ]; then python tracker.py --apply-decisions; else python tracker.py; fi ;;
          esac

      - name: Save state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A state.json releases.csv history.html docs pending.json rejected.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Update tracked versions" && git pull --rebase -q && git push)
