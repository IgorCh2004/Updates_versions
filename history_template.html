<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>История обновлений брокерских приложений</title>
<style>
:root { color-scheme: light dark; --bg:#f5f6f8; --card:#fff; --fg:#1d1f23; --muted:#6b7280; --line:#e3e5e9; --accent:#2563eb; --accent-fg:#fff;
  --ok:#15803d; --ok-bg:#dcfce7; --bad:#b91c1c; --bad-bg:#fee2e2; --warn:#92400e; --warn-bg:#fef3c7; }
@media (prefers-color-scheme: dark) {
  :root { --bg:#14161a; --card:#1e2127; --fg:#e8eaed; --muted:#9aa0a9; --line:#2d3139; --accent:#6ea0ff; --accent-fg:#0b1220;
    --ok:#86efac; --ok-bg:#14301f; --bad:#fca5a5; --bad-bg:#3b1a1a; --warn:#fcd34d; --warn-bg:#3a2e12; }
}
* { box-sizing: border-box; }
body { margin:0; padding:16px; background:var(--bg); color:var(--fg);
  font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif; }
main { max-width:860px; margin:0 auto; }
h1 { font-size:22px; margin:8px 0 4px; }
.sub { color:var(--muted); margin:0 0 12px; font-size:13px; }
.tabs { display:flex; gap:8px; margin:0 0 12px; }
button.tab { font:inherit; font-size:15px; font-weight:600; padding:8px 16px; border:1px solid var(--line); border-radius:8px;
  background:var(--card); color:var(--muted); cursor:pointer; }
button.tab[aria-selected="true"] { background:var(--accent); border-color:var(--accent); color:var(--accent-fg); }
.feat { margin:8px 0 0; overflow-wrap:anywhere; }
.panel { position:sticky; top:0; z-index:1; background:var(--bg); padding:8px 0 10px; border-bottom:1px solid var(--line); }
.row { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:8px; }
.label { color:var(--muted); font-size:13px; min-width:90px; }
button.chip { font:inherit; font-size:14px; padding:6px 12px; border:1px solid var(--line); border-radius:999px;
  background:var(--card); color:var(--fg); cursor:pointer; }
button.chip[aria-pressed="true"] { background:var(--accent); border-color:var(--accent); color:var(--accent-fg); }
select, input[type=date], input[type=search] { font:inherit; padding:6px 10px; border:1px solid var(--line);
  border-radius:8px; background:var(--card); color:var(--fg); }
input[type=search] { flex:1 1 220px; min-width:0; }
select { cursor:pointer; min-width:180px; }
.range { display:flex; flex-wrap:wrap; gap:8px; align-items:center; color:var(--muted); font-size:13px; }
.count { color:var(--muted); font-size:13px; margin:12px 0; }
.card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px 16px; margin-bottom:12px; }
.head { display:flex; flex-wrap:wrap; gap:4px 12px; align-items:center; }
.app { font-weight:600; display:inline-flex; align-items:center; gap:8px; }
.ico { width:28px; height:28px; border-radius:7px; flex:none; object-fit:cover; }
.ico-sel { width:24px; height:24px; border-radius:6px; }
.ver { color:var(--accent); font-weight:600; overflow-wrap:anywhere; }
.date { color:var(--muted); font-size:13px; margin-left:auto; }
.notes { margin:8px 0 0; white-space:pre-wrap; overflow-wrap:anywhere; }
.none { color:var(--muted); font-style:italic; }
.link { display:inline-block; margin-top:8px; font-size:13px; color:var(--accent); }
.badge { font-size:12px; font-weight:600; padding:2px 9px; border-radius:999px; white-space:nowrap; }
.badge.pending { background:var(--warn-bg); color:var(--warn); }
.badge.checked { background:var(--ok-bg); color:var(--ok); }
.badge.rejected { background:var(--bad-bg); color:var(--bad); }
.card.rejected { opacity:.65; }
.actions { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-top:12px; }
.actions .link { margin:0 auto 0 0; }
.actions { justify-content:flex-end; }
.state { font-size:13px; color:var(--muted); }
button.act { font:inherit; font-size:14px; padding:6px 14px; border:1px solid var(--line); border-radius:8px; cursor:pointer; }
button.act:disabled { opacity:.5; cursor:default; }
button.act.bad { background:var(--bad-bg); border-color:var(--bad); color:var(--bad); font-weight:600; }
button.act.ok { background:var(--ok-bg); border-color:var(--ok); color:var(--ok); font-weight:600; }
button.plain { font:inherit; font-size:14px; padding:6px 12px; border:1px solid var(--line); border-radius:8px;
  background:var(--card); color:var(--fg); cursor:pointer; }
mark { background:#ffe58a; color:#000; border-radius:2px; }
.empty { text-align:center; color:var(--muted); padding:32px 0; }
[hidden] { display:none !important; }
@media (max-width:520px) { .label { min-width:100%; } }
</style>
</head>
<body>
<main>
<h1>История обновлений брокерских приложений</h1>
<p class="sub">Данные RuStore. Обновлено: __UPDATED__</p>

<div class="tabs" role="tablist">
  <button class="tab" id="tab-versions" type="button" role="tab">Версии</button>
  <button class="tab" id="tab-features" type="button" role="tab">Новые функции</button>
</div>

<div class="panel">
  <div class="row">
    <span class="label">Период</span>
    <select id="period" aria-label="Период">
      <option value="day">День</option>
      <option value="week">Неделя</option>
      <option value="month">Месяц</option>
      <option value="all">Всё время</option>
      <option value="custom">Свой период…</option>
    </select>
  </div>
  <div class="row range" id="range" hidden>
    <span class="label"></span>
    <label>с <input type="date" id="from"></label>
    <label>по <input type="date" id="to"></label>
  </div>
  <div class="row">
    <span class="label">Приложение</span>
    <img id="appico" class="ico ico-sel" alt="" hidden>
    <select id="apps" aria-label="Приложение"></select>
  </div>
  <div class="row" id="statusrow">
    <span class="label">Статус</span>
    <select id="status" aria-label="Статус">
      <option value="">Все</option>
      <option value="checked">Проверенные</option>
      <option value="pending">Не проверенные</option>
      <option value="rejected">Отклонённые</option>
    </select>
  </div>
  <div class="row" style="margin-bottom:0">
    <span class="label">Поиск</span>
    <input id="q" type="search" placeholder="Поиск по тексту «Что нового»" aria-label="Поиск">
  </div>
</div>

<div class="count" id="syncerr" hidden style="color:var(--bad)">Не удалось загрузить общие отметки — показаны без них. Обновите страницу.</div>
<div class="count" id="count"></div>
<div id="list"></div>

</main>
<script>
const RELEASES = __DATA__;
const APPS = __APPS__;
const FEATURES = __FEATURES__;   // новые функции, выделенные из текста релизов
const NEW_VERSIONS = new Set(__UNCHECKED__);   // «пакет|версия» новых версий; у старых плашек нет
const BADGES = { pending: "Не проверено", checked: "Проверено", rejected: "Отклонено" };
const $ = id => document.getElementById(id);
const ICONS = Object.fromEntries(APPS.filter(a => a.icon).map(a => [a.package, a.icon]));
const state = { tab: location.hash === "#features" ? "features" : "versions", period: "month", app: "", status: "", from: "", to: "" };

function iso(d) {
  const p = n => String(n).padStart(2, "0");
  return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate());
}
function daysAgo(n) { const d = new Date(); d.setDate(d.getDate() - n); return iso(d); }
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}
function fmtDate(s) { return s ? s.split("-").reverse().join(".") : "дата не указана"; }

// выпадающий список приложений: «Все» + по одному на приложение из config.json
function buildAppSelect() {
  const box = $("apps");
  box.replaceChildren();
  for (const [value, label] of [["", "Все приложения"], ...APPS.map(a => [a.package, a.name])]) {
    const o = el("option", "", label);
    o.value = value;
    box.appendChild(o);
  }
  box.addEventListener("change", () => { state.app = box.value; sync(); });
}

const keyOf = r => r.package + "|" + r.version;
// отметки общие для всей команды: хранятся в Cloudflare Worker («пакет|версия» → {status, at})
const API = "https://quiet-mountain-285d.igorek-rgbdg.workers.dev";
let marks = {};
const markOf = r => marks[keyOf(r)] || null;
const statusOf = r => !NEW_VERSIONS.has(keyOf(r)) ? "" : (markOf(r) || {}).status || "pending";
async function loadMarks() {
  try {
    const res = await fetch(API);
    if (!res.ok) throw new Error(res.status);
    marks = await res.json();
    $("syncerr").hidden = true;
  } catch (e) { $("syncerr").hidden = false; }
  render();
}
async function setMark(r, value) {
  const key = keyOf(r), before = marks[key];
  if (value) marks[key] = { status: value, at: new Date().toISOString() }; else delete marks[key];
  render();
  try {
    const res = await fetch(API, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ key, status: value }) });
    if (!res.ok) throw new Error(res.status);
  } catch (e) {
    if (before) marks[key] = before; else delete marks[key];
    render();
    alert("Не удалось сохранить отметку. Проверьте интернет и попробуйте ещё раз.");
  }
}

function range() {
  if (state.period === "all") return ["0000-01-01", "9999-12-31"];
  if (state.period === "day") return [daysAgo(1), iso(new Date())];
  if (state.period === "week") return [daysAgo(7), iso(new Date())];
  if (state.period === "month") return [daysAgo(30), iso(new Date())];
  return [state.from || "0000-01-01", state.to || "9999-12-31"];
}

function highlight(parent, text, needle) {
  if (!needle) { parent.textContent = text; return; }
  const low = text.toLowerCase();
  let pos = 0, i;
  while ((i = low.indexOf(needle, pos)) !== -1) {
    parent.append(text.slice(pos, i));
    parent.appendChild(el("mark", "", text.slice(i, i + needle.length)));
    pos = i + needle.length;
  }
  parent.append(text.slice(pos));
}

function renderFeatures(from, to, needle) {
  const byApp = FEATURES.filter(f => !state.app || f.package === state.app);
  const shown = byApp.filter(f => {
    const d = f.date || f.checked;
    return d >= from && d <= to && (!needle || f.text.toLowerCase().includes(needle));
  });
  const list = $("list");
  list.replaceChildren();
  $("count").textContent = "Новых функций за период: " + shown.length +
    (state.period === "custom" || state.period === "all" ? "" : " (" + fmtDate(from) + " — " + fmtDate(to) + ")");
  if (!shown.length) {
    const e = el("div", "empty", "За выбранный период новых функций нет.");
    if (byApp.length) {
      const last = byApp[0];
      e.appendChild(el("div", "", "Последняя: " + last.name + " " + last.version + ", " + fmtDate(last.date)));
    }
    list.appendChild(e);
    return;
  }
  for (const f of shown) {
    const card = el("div", "card");
    const head = el("div", "head");
    const app = el("span", "app");
    if (ICONS[f.package]) { const img = el("img", "ico"); img.src = ICONS[f.package]; img.alt = ""; app.appendChild(img); }
    app.append(f.name);
    head.append(app, el("span", "ver", f.version), el("span", "date", fmtDate(f.date)));
    card.appendChild(head);
    const text = el("p", "feat");
    highlight(text, f.text, needle);
    card.appendChild(text);
    list.appendChild(card);
  }
}

function render() {
  const [from, to] = range();
  const needle = $("q").value.trim().toLowerCase();
  if (state.tab === "features") return renderFeatures(from, to, needle);
  const byApp = RELEASES.filter(r => !state.app || r.package === state.app);
  const shown = byApp.filter(r => {
    const d = r.date || r.checked;
    return d >= from && d <= to && (!state.status || statusOf(r) === state.status) &&
      (!needle || (r.whats_new + " " + r.version).toLowerCase().includes(needle));
  });
  const list = $("list");
  list.replaceChildren();
  $("count").textContent = "Обновлений за период: " + shown.length +
    (state.period === "custom" || state.period === "all" ? "" : " (" + fmtDate(from) + " — " + fmtDate(to) + ")");
  if (!shown.length) {
    const e = el("div", "empty", "За выбранный период обновлений нет.");
    if (byApp.length) {
      const last = byApp[0];
      e.appendChild(el("div", "", "Последнее обновление: " + last.name + " " + last.version + ", " + fmtDate(last.date)));
    }
    list.appendChild(e);
    return;
  }
  for (const r of shown) {
    const st = statusOf(r);
    const card = el("div", "card" + (st === "rejected" ? " rejected" : ""));
    const head = el("div", "head");
    const app = el("span", "app");
    if (ICONS[r.package]) { const img = el("img", "ico"); img.src = ICONS[r.package]; img.alt = ""; app.appendChild(img); }
    app.append(r.name);
    head.append(app, el("span", "ver", r.version));
    if (BADGES[st]) head.appendChild(el("span", "badge " + st, BADGES[st]));
    const m = markOf(r);
    if (st && m && m.at) head.appendChild(el("span", "state", fmtDate(m.at.slice(0, 10))));
    head.appendChild(el("span", "date", fmtDate(r.date)));
    card.appendChild(head);
    const notes = el("p", r.whats_new ? "notes" : "notes none");
    if (r.whats_new) highlight(notes, r.whats_new, needle); else notes.textContent = "Описание не указано.";
    card.appendChild(notes);
    const a = el("a", "link", "Страница в RuStore");
    a.href = "https://www.rustore.ru/catalog/app/" + encodeURIComponent(r.package) + "/versions";
    a.target = "_blank"; a.rel = "noopener";
    if (st) {   // у новых версий есть кнопки: «Проверить» → «Проверено», «Отклонить» → «Отклонено»
      const actions = el("div", "actions");
      const button = (cls, text, mark) => {
        const b = el("button", cls, text);
        b.type = "button";
        b.addEventListener("click", () => setMark(r, mark));
        return b;
      };
      a.style.marginTop = "0";
      actions.appendChild(a);
      if (st === "pending") actions.append(button("act bad", "Отклонить", "rejected"), button("act ok", "Проверить", "checked"));
      else actions.appendChild(button("plain", "Снять отметку", ""));
      card.appendChild(actions);
    } else {
      card.appendChild(a);
    }
    list.appendChild(card);
  }
}

function sync() {
  for (const t of ["versions", "features"]) $("tab-" + t).setAttribute("aria-selected", String(state.tab === t));
  $("statusrow").hidden = state.tab === "features";   // отметки «проверено» относятся к версиям, а не к функциям
  $("q").placeholder = state.tab === "features" ? "Поиск по новым функциям" : "Поиск по тексту «Что нового»";
  $("period").value = state.period;
  $("apps").value = state.app;
  $("status").value = state.status;
  $("appico").hidden = !ICONS[state.app];
  if (ICONS[state.app]) $("appico").src = ICONS[state.app];
  $("range").hidden = state.period !== "custom";
  render();
}

for (const t of ["versions", "features"]) $("tab-" + t).addEventListener("click", () => {
  state.tab = t;
  history.replaceState(null, "", t === "features" ? "#features" : location.pathname + location.search);
  sync();
});
$("period").addEventListener("change", e => {
  state.period = e.target.value;
  if (state.period === "custom" && !state.from) {
    state.from = daysAgo(30); state.to = iso(new Date());
    $("from").value = state.from; $("to").value = state.to;
  }
  sync();
});
$("from").addEventListener("change", e => { state.from = e.target.value; render(); });
$("to").addEventListener("change", e => { state.to = e.target.value; render(); });
$("q").addEventListener("input", render);
$("status").addEventListener("change", e => { state.status = e.target.value; render(); });

buildAppSelect();
sync();
loadMarks();
</script>
</body>
</html>
