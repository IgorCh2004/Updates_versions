name: RuStore tracker

on:
  schedule:
    - cron: "0 7 * * *"   # каждый день в 07:00 UTC = 10:00 МСК
  workflow_dispatch:
    inputs:
      mode:
        description: "Режим запуска"
        type: choice
        default: check
        options:
          - check
          - test-email
          - debug

permissions:
  contents: write

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tracker
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MODE: ${{ inputs.mode }}
        run: |
          case "$MODE" in
            test-email) python tracker.py --test-email ;;
            debug)      python tracker.py --dry-run --debug ;;
            *)          python tracker.py ;;
          esac

      - name: Save state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A state.json releases.csv 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Update tracked versions" && git push)
